name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: Format, typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - run: bun install --frozen-lockfile
      - run: bun run format:check
      - run: bun run typecheck
      - run: bun test
      - run: bun run build

  benchmark-adapter:
    name: Harbor adapter tests
    runs-on: ubuntu-latest
    if: hashFiles('benchmark/tests/*.py') != ''
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: >-
          uv run --python 3.13 --with harbor==0.23.0 --with pytest
          pytest -c benchmark/pytest.ini --rootdir benchmark benchmark/tests -q
